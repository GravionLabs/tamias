[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "app/src-tauri"]
# The desktop app needs the Tauri system libraries (webkit2gtk on Linux) and the built frontend
# (app/dist); a plain `cargo build` or `cargo test` in the root leaves it out.
default-members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/GravionLabs/tamias"
authors = ["Jérôme Kaufmann"]

[workspace.dependencies]
tamias-core = { path = "crates/core", version = "0.1.2" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
