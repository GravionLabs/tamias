mode: ContinuousDeployment
next-version: 0.1.0

# The bump comes from Conventional Commits (versioning/determine-version of GravionLabs/ci): fix = patch, feat = minor,
# type! or BREAKING CHANGE = major. release/next has no fixed increment. next-version seeds the first release only;
# GitVersion ignores it once a higher v* tag exists.
#
# Release candidates (release.yml dispatched on a release/* branch, #205, #206): a tag with a pre-release part (v0.8.0-rc.3) is no
# version source: tag-prefix does not match a prefix followed by digits and a "-", so GitVersion ignores it and the
# next stable version is the same with and without release candidates.
tag-prefix: "(?![vV]?[0-9.]+-)[vV]?"

# determine-version derives the channel from the branch (release/* rc, other branches beta); release/* yields
# <next stable>-rc.<n> for the release candidate of the manual test at the end of a milestone;
# n counts the commits since the last stable tag, so every commit gets its own number.
branches:
  release:
    regex: ^release/.+$
    label: rc
    mode: ContinuousDelivery
