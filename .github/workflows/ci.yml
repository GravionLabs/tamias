name: CI

# Pushes to main run these checks through release.yml (workflow_call), so they run once per release.
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches: ["release/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # never cancel the checks of a release run (workflow_call from release.yml on main)
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Docs of tamias-core
        run: cargo doc --no-deps -p tamias-core --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Test
        run: cargo test --workspace --locked
