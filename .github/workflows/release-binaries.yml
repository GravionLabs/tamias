# CLI release archives (#33): builds the tamias CLI for five targets, packs each into tamias-<version>-<target>.tar.gz
# (Windows: .zip) with LICENSE and README.md, writes SHA256SUMS over all archives and attaches them to the release.
#
# workflow_call from release.yml with the tag gh-release created (v<version>): builds the tagged commit, so the
#   binaries report the released version, and uploads the archives and SHA256SUMS to that release (--clobber, so a
#   re-run replaces them).
# workflow_dispatch: dry run of the current ref; builds and checks all targets and keeps the archives and SHA256SUMS
#   as run artifacts, uploads nothing.
#
# musl targets use the musl-tools of Ubuntu (musl-gcc as C compiler for the bundled SQLite of rusqlite and for ring of
# rustls); no OpenSSL is linked, so neither cross nor cargo-zigbuild is needed. aarch64 builds natively on the arm
# runner. x86_64-apple-darwin is cross-compiled on the arm macOS runner and checked with `file` instead of being run.
#
# Desktop app (#88): the `app` jobs run `tauri build` for unsigned bundles (no signing or notarisation in v1) and
# rename them to tamias-app-<version>-<target>.<ext>: .dmg (aarch64 and x86_64 apple-darwin), .msi
# (x86_64-pc-windows-msvc), .AppImage and .deb (x86_64-unknown-linux-gnu). The version is the Cargo workspace version
# (tauri.conf.json has none, so Tauri takes it from the crate), which set-version.sh wrote into the tag. SHA256SUMS
# covers the CLI archives and the bundles. Each bundle ships the CLI as a sidecar (#89): built for the same target by
# `pnpm sidecar` before `tauri build` and placed under app/src-tauri/binaries/.
# No build cache: release binaries are built from a clean state.
name: Release binaries

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag (v<version>) to build and upload to
        required: true
        type: string
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-binaries-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, check: run }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, check: run }
          - { target: aarch64-apple-darwin, os: macos-latest, check: run }
          - { target: x86_64-apple-darwin, os: macos-latest, check: file }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, check: run }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      CHECK: ${{ matrix.check }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the tag on release, the dispatched ref on a dry run
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Install musl-tools
        if: contains(matrix.target, '-linux-musl')
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"

      # rust-toolchain.toml pins the toolchain; the target is added to it.
      - name: Install toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup target add "$TARGET"

      - name: Determine version
        id: version
        run: |
          id="$(cargo pkgid -p tamias)"
          version="${id##*[#@]}"
          if [ -n "$TAG" ] && [ "v$version" != "$TAG" ]; then
            echo "::error::Cargo.toml of $TAG has version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: cargo build -p tamias --bins --release --locked --target "$TARGET"

      - name: Check binary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          exe=''
          [[ "$TARGET" == *-windows-* ]] && exe=.exe
          bin="target/$TARGET/release/tamias$exe"
          if command -v file >/dev/null; then file "$bin"; fi
          if [ "$CHECK" = run ]; then
            out="$("$bin" --version)"
            echo "$out"
            [ "$out" = "tamias $VERSION" ] || { echo "::error::expected 'tamias $VERSION'"; exit 1; }
          else
            file -b "$bin" | grep -q 'Mach-O 64-bit.*x86_64' || { echo "::error::not an x86_64 Mach-O binary"; exit 1; }
          fi
          if [[ "$TARGET" == *-linux-musl ]]; then
            file -b "$bin" | grep -Eq 'static(-pie)? linked|statically linked' \
              || { echo "::error::not statically linked"; exit 1; }
            ldd_out="$(ldd "$bin" 2>&1 || true)"
            echo "ldd: $ldd_out"
            if grep -q '=>' <<<"$ldd_out"; then echo "::error::links shared libraries"; exit 1; fi
          fi

      - name: Package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # dist is relative, so is the printed archive path (dist/<archive>); upload-artifact resolves it against the
        # workspace on every runner, where an absolute Git Bash path (/d/a/...) would not resolve on Windows.
        run: |
          archive="$(bash .github/scripts/package-release.sh "$VERSION" "$TARGET" "target/$TARGET/release" dist)"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 7

  app:
    name: App ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest, bundles: dmg }
          - { target: x86_64-apple-darwin, os: macos-latest, bundles: dmg }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, bundles: msi }
          # 22.04 so the AppImage links the older glibc and starts on current Ubuntu releases too
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, bundles: "appimage,deb" }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      TARGET: ${{ matrix.target }}
      BUNDLES: ${{ matrix.bundles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      # The system libraries of Tauri on Linux, as in the app job of ci.yml.
      - name: Install the Tauri Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: Install toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup target add "$TARGET"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: app/.nvmrc
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Determine version
        id: version
        run: |
          id="$(cargo pkgid -p tamias-app)"
          version="${id##*[#@]}"
          if [ -n "$TAG" ] && [ "v$version" != "$TAG" ]; then
            echo "::error::Cargo.toml of $TAG has version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The CLI sidecar (#89, bundle.externalBin) of the same version and target, built before the bundle step:
      # app/src-tauri/binaries/tamias-$TARGET[.exe], on Windows also tamiasw-$TARGET.exe. The app runs it for
      # `tamias service status|install|uninstall`. x86_64-apple-darwin is cross-compiled and not run.
      - name: Build the CLI sidecar
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pnpm sidecar --release --target "$TARGET"
          ls -l src-tauri/binaries
          exe=''
          [[ "$TARGET" == *-windows-* ]] && exe=.exe
          bin="src-tauri/binaries/tamias-$TARGET$exe"
          if [ "$TARGET" != x86_64-apple-darwin ]; then
            out="$("$bin" --version)"
            [ "$out" = "tamias $VERSION" ] || { echo "::error::sidecar reports '$out', expected 'tamias $VERSION'"; exit 1; }
          fi
          if [ -n "$exe" ] && [ ! -f "src-tauri/binaries/tamiasw-$TARGET.exe" ]; then
            echo "::error::tamiasw-$TARGET.exe missing"
            exit 1
          fi

      # beforeBuildCommand (pnpm build) builds the frontend; no signing keys are set, so the bundles are unsigned.
      - name: Build the bundles
        run: pnpm tauri build --target "$TARGET" --bundles "$BUNDLES" --ci

      - name: Collect the bundles
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p ../dist
          shopt -s nullglob
          found=0
          for f in ../target/"$TARGET"/release/bundle/{dmg/*.dmg,msi/*.msi,appimage/*.AppImage,deb/*.deb}; do
            ext="${f##*.}"
            cp "$f" "../dist/tamias-app-$VERSION-$TARGET.$ext"
            found=$((found + 1))
          done
          expected="$(awk -F, '{print NF}' <<<"$BUNDLES")"
          [ "$found" -eq "$expected" ] || { echo "::error::expected $expected bundle(s), found $found"; find ../target/"$TARGET"/release/bundle -type f; exit 1; }
          ls -l ../dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.target }}
          path: dist/tamias-app-*
          if-no-files-found: error
          retention-days: 7

  checksums:
    name: SHA256SUMS
    needs: [build, app]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          shopt -s nullglob
          archives=(tamias-*.tar.gz tamias-*.zip tamias-app-*.dmg tamias-app-*.msi tamias-app-*.AppImage tamias-app-*.deb)
          [ "${#archives[@]}" -eq 10 ] || { echo "::error::expected 5 archives and 5 bundles, got ${#archives[@]}: ${archives[*]}"; exit 1; }
          sha256sum "${archives[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  upload:
    name: Upload to ${{ inputs.tag }}
    needs: checksums
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload
    steps:
      # only the release artifacts (archive-<target>, bundle-<target> and SHA256SUMS), so other run artifacts never land
      # in the release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SHA256SUMS
          path: dist

      - name: Upload archives, bundles and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
