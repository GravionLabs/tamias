# CLI release archives (#33): builds the tamias CLI for five targets, packs each into tamias-<version>-<target>.tar.gz
# (Windows: .zip) with LICENSE and README.md, writes SHA256SUMS over all archives and attaches them to the release.
#
# workflow_call from release.yml with the tag gh-release created (v<version>): builds the tagged commit, so the
#   binaries report the released version, and uploads the archives and SHA256SUMS to that release (--clobber, so a
#   re-run replaces them).
# workflow_dispatch: dry run of the current ref; builds and checks all targets and keeps the archives and SHA256SUMS
#   as run artifacts, uploads nothing.
#
# musl targets use the musl-tools of Ubuntu (musl-gcc as C compiler for the bundled SQLite of rusqlite and for ring of
# rustls); no OpenSSL is linked, so neither cross nor cargo-zigbuild is needed. aarch64 builds natively on the arm
# runner. x86_64-apple-darwin is cross-compiled on the arm macOS runner and checked with `file` instead of being run.
# No build cache: release binaries are built from a clean state.
name: Release binaries

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag (v<version>) to build and upload to
        required: true
        type: string
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-binaries-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, check: run }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, check: run }
          - { target: aarch64-apple-darwin, os: macos-latest, check: run }
          - { target: x86_64-apple-darwin, os: macos-latest, check: file }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, check: run }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      CHECK: ${{ matrix.check }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the tag on release, the dispatched ref on a dry run
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Install musl-tools
        if: contains(matrix.target, '-linux-musl')
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"

      # rust-toolchain.toml pins the toolchain; the target is added to it.
      - name: Install toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup target add "$TARGET"

      - name: Determine version
        id: version
        run: |
          id="$(cargo pkgid -p tamias)"
          version="${id##*[#@]}"
          if [ -n "$TAG" ] && [ "v$version" != "$TAG" ]; then
            echo "::error::Cargo.toml of $TAG has version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: cargo build -p tamias --bins --release --locked --target "$TARGET"

      - name: Check binary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          exe=''
          [[ "$TARGET" == *-windows-* ]] && exe=.exe
          bin="target/$TARGET/release/tamias$exe"
          if command -v file >/dev/null; then file "$bin"; fi
          if [ "$CHECK" = run ]; then
            out="$("$bin" --version)"
            echo "$out"
            [ "$out" = "tamias $VERSION" ] || { echo "::error::expected 'tamias $VERSION'"; exit 1; }
          else
            file -b "$bin" | grep -q 'Mach-O 64-bit.*x86_64' || { echo "::error::not an x86_64 Mach-O binary"; exit 1; }
          fi
          if [[ "$TARGET" == *-linux-musl ]]; then
            file -b "$bin" | grep -Eq 'static(-pie)? linked|statically linked' \
              || { echo "::error::not statically linked"; exit 1; }
            ldd_out="$(ldd "$bin" 2>&1 || true)"
            echo "ldd: $ldd_out"
            if grep -q '=>' <<<"$ldd_out"; then echo "::error::links shared libraries"; exit 1; fi
          fi

      - name: Package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          archive="$(bash .github/scripts/package-release.sh "$VERSION" "$TARGET" "target/$TARGET/release" dist)"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 7

  checksums:
    name: SHA256SUMS
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          shopt -s nullglob
          archives=(tamias-*.tar.gz tamias-*.zip)
          [ "${#archives[@]}" -eq 5 ] || { echo "::error::expected 5 archives, got ${#archives[@]}: ${archives[*]}"; exit 1; }
          sha256sum "${archives[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  upload:
    name: Upload to ${{ inputs.tag }}
    needs: checksums
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Upload archives and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
