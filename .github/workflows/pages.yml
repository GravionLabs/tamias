name: Pages

# The documentation site on GitHub Pages (docs/adr/0002-documentation-site.md): docs/ as a website (site/, VitePress),
# at https://<owner>.github.io/<repository>/. A pull request that touches the site or its documents builds it, so a
# broken link is found before the merge (a dead link fails the build); only main deploys, and only while the repository
# variable DEPLOY_PAGES is "true" (Settings -> Pages -> Source must be "GitHub Actions").
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main, 'release/**']
    paths:
      - 'site/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Deployments queue up behind each other and the last one wins; a pull request replaces its own earlier run.
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the site
    if: github.event_name == 'pull_request' || vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # site/ is its own pnpm root; the pnpm version comes from its packageManager field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm --dir site install --frozen-lockfile
      - run: pnpm --dir site test
      # Every address needs the prefix https://<owner>.github.io/<repository>/. Dead links fail this step.
      - name: Build the documentation site
        run: pnpm --dir site build
        env:
          SITE_BASE: /${{ github.event.repository.name }}/
      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/.vitepress/dist

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
