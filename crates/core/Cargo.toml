[package]
name = "tamias-core"
description = "Providers, snapshot store and daily budget calculation of tamias"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
directories = "6.0.0"
jiff = { version = "0.2.39", features = ["serde"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
ureq = "3.5.1"

[dev-dependencies]
jiff = { version = "0.2.39", features = ["serde", "tzdb-bundle-always"] }
tempfile = "3.27.0"
