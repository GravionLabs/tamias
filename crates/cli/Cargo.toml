[package]
name = "tamias"
description = "Shows how much of your Claude usage limits you used today against the daily budget"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "tamias"
path = "src/main.rs"

# Windowless twin of `tamias collect` for the Windows Task Scheduler; built everywhere, used on Windows.
[[bin]]
name = "tamiasw"
path = "src/bin/tamiasw.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
http = "1.5.0"
jiff = "0.2.39"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tamias-core.workspace = true
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi"] }

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
jiff = { version = "0.2.39", features = ["tzdb-bundle-always"] }
jsonschema = { version = "0.60.2", default-features = false }
predicates = "3.1.4"
rusqlite = { version = "0.41.1", features = ["bundled"] }
tempfile = "3.27.0"
