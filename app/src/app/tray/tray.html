<main class="card">
  @if (error(); as message) {
    <p class="note" role="alert" data-testid="error">Cannot read today's usage: {{ message }}</p>
  } @else if (report(); as r) {
    @for (p of shown(r); track p.provider) {
      <section class="provider" [attr.data-provider]="p.provider" [attr.data-status]="p.status">
        <h2>{{ providerLabel(p.provider) }} Usage</h2>
        @if (note(p); as text) {
          <p class="note" data-testid="note">{{ text }}</p>
        }
        <app-window-list [windows]="p.windows" />
      </section>
    }
  } @else {
    <p class="note" role="status">Reading usage…</p>
  }
  <button type="button" class="open" (click)="open()">
    <span>Open tamias</span>
    <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false">
      <path
        d="M6 3.5h6.5V10M12.5 3.5 4 12"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>
</main>
