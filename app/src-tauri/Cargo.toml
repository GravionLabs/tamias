[package]
name = "tamias-app"
description = "Desktop app of tamias: today's usage against the daily budget per provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
# The `_lib` suffix keeps the library name apart from the binary name (cargo#8519, an issue on Windows).
name = "tamias_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
jiff = "0.2.39"
notify = "8.2.1"
serde = { version = "1.0.229", features = ["derive"] }
# the generated Tauri context (plugins config) expands to serde_json::json!
serde_json = "1.0.154"
tamias-core.workspace = true
tauri = { version = "2.12.5", features = ["image-png", "tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2.7.0"
thiserror = "2.0.21"

[dev-dependencies]
jsonschema = { version = "0.60.2", default-features = false }
rusqlite = { version = "0.41.1", features = ["bundled"] }
tempfile = "3.27.0"

[lints]
workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.14.1"
